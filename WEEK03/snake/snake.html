<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    h1 {
        margin-bottom: 10px;
    }

    #score {
        font-size: 20px;
        margin-bottom: 10px;
    }

    canvas {
        background: #222;
        border: 3px solid #0f0;
        box-shadow: 0 0 20px #0f0;
    }

    #gameOver {
        margin-top: 10px;
        color: red;
        font-size: 24px;
        display: none;
    }
</style>
</head>
<body>

<h1>🐍 Snake Game</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="gameOver">Game Over! Press SPACE to Restart</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const gameOverText = document.getElementById("gameOver");

const grid = 20;
const tileCount = canvas.width / grid;

let snake, food, dx, dy, score, gameLoop;

function init() {
    snake = [{x: 10, y: 10}];
    food = randomFood();
    dx = 1;
    dy = 0;
    score = 0;
    scoreText.textContent = "Score: " + score;
    gameOverText.style.display = "none";

    if (gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(update, 100);
}

function randomFood() {
    return {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
    };
}

function update() {
    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    // Wall collision
    if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= tileCount ||
        head.y >= tileCount
    ) {
        endGame();
        return;
    }

    // Self collision
    for (let part of snake) {
        if (head.x === part.x && head.y === part.y) {
            endGame();
            return;
        }
    }

    snake.unshift(head);

    // Eat food
    if (head.x === food.x && head.y === food.y) {
        score++;
        scoreText.textContent = "Score: " + score;

        do {
            food = randomFood();
        } while (
            snake.some(
                segment =>
                    segment.x === food.x &&
                    segment.y === food.y
            )
        );
    } else {
        snake.pop();
    }

    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw food
    ctx.fillStyle = "red";
    ctx.fillRect(food.x * grid, food.y * grid, grid - 2, grid - 2);

    // Draw snake
    snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#00FF00" : "#66FF66";
        ctx.fillRect(
            segment.x * grid,
            segment.y * grid,
            grid - 2,
            grid - 2
        );
    });
}

function endGame() {
    clearInterval(gameLoop);
    gameOverText.style.display = "block";
}

document.addEventListener("keydown", e => {
    switch (e.key) {
        case "ArrowUp":
            if (dy === 0) {
                dx = 0;
                dy = -1;
            }
            break;
        case "ArrowDown":
            if (dy === 0) {
                dx = 0;
                dy = 1;
            }
            break;
        case "ArrowLeft":
            if (dx === 0) {
                dx = -1;
                dy = 0;
            }
            break;
        case "ArrowRight":
            if (dx === 0) {
                dx = 1;
                dy = 0;
            }
            break;
        case " ":
            if (gameOverText.style.display === "block") {
                init();
            }
            break;
    }
});

init();
</script>

</body>
</html>
