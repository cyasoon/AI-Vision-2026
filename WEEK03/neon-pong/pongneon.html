<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Pong AI Challenge</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        overflow: hidden;
        background: black;
        font-family: Arial, sans-serif;
    }
    canvas {
        display: block;
    }
    #ui {
        position: absolute;
        top: 15px;
        left: 15px;
        color: white;
        text-shadow: 0 0 10px cyan;
        font-size: 20px;
    }
</style>
</head>
<body>
<div id="ui">
    <div>MISSION: NEON PONG</div>
    <div>Score: <span id="score">0</span></div>
    <div>Ball Speed: <span id="speed">1x</span></div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const bgColors = [
    "#000000",
    "#100020",
    "#001133",
    "#220011",
    "#002200",
    "#331100",
    "#111144"
];

let bgIndex = 0;
let score = 0;

const paddle = {
    width: 20,
    height: 140,
    x: 30,
    y: canvas.height / 2 - 70
};

const ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 12,
    vx: 5,
    vy: 3
};

// HUNDRLE 1: Precision Control
document.addEventListener("mousemove", (e) => {
    paddle.y = e.clientY - paddle.height / 2;
});

document.addEventListener("touchmove", (e) => {
    paddle.y = e.touches[0].clientY - paddle.height / 2;
});

function drawGlowRect(x, y, w, h, color) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    ctx.shadowBlur = 0;
}

function drawGlowCircle(x, y, r, color) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
}

function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.vx = 5;
    ball.vy = (Math.random() * 6) - 3;
}

function update() {

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Top/Bottom bounce
    if (ball.y <= ball.radius ||
        ball.y >= canvas.height - ball.radius) {
        ball.vy *= -1;
    }

    // Paddle collision
    if (
        ball.x - ball.radius <= paddle.x + paddle.width &&
        ball.y >= paddle.y &&
        ball.y <= paddle.y + paddle.height &&
        ball.vx < 0
    ) {
        ball.vx *= -2; // HUNDRLE 2: 100% faster every hit
        ball.vy *= 1.2;

        score++;

        document.getElementById("score").innerText = score;
        document.getElementById("speed").innerText =
            Math.abs(ball.vx / 5).toFixed(0) + "x";

        // HUNDRLE 3: Background changes every 5 points
        if (score % 5 === 0) {
            bgIndex = (bgIndex + 1) % bgColors.length;
        }
    }

    // Right wall bounce
    if (ball.x >= canvas.width - ball.radius) {
        ball.vx *= -1;
    }

    // Missed paddle
    if (ball.x < -50) {
        alert("GAME OVER!\nFinal Score: " + score);
        score = 0;
        bgIndex = 0;
        document.getElementById("score").innerText = score;
        document.getElementById("speed").innerText = "1x";
        resetBall();
    }
}

function drawGrid() {
    ctx.strokeStyle = "rgba(0,255,255,0.1)";
    for (let i = 0; i < canvas.width; i += 50) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
    }
    for (let i = 0; i < canvas.height; i += 50) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
    }
}

function draw() {
    ctx.fillStyle = bgColors[bgIndex];
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawGrid();

    drawGlowRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height,
        "#00ffff"
    );

    drawGlowCircle(
        ball.x,
        ball.y,
        ball.radius,
        "#ff00ff"
    );

    // Center line
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.setLineDash([10,10]);
    ctx.beginPath();
    ctx.moveTo(canvas.width/2,0);
    ctx.lineTo(canvas.width/2,canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
